[tool.poetry]
name = "otus-dz10"
version = "0.1.0"
description = "Proxmox VE in Yandex Cloud and a Terraform-managed guest"
authors = ["OTUS student"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
cryptography = "46.0.3"
paramiko = "4.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "0.14.5"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
